<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Restaurants - Ibad Foodz | Food Delivery</title>
    <meta name="description" content="Browse all restaurants on Ibad Foodz. Discover best food from top restaurants near you.">
    <meta name="keywords" content="restaurants, food delivery, order food online, Ibad Foodz">
    <link rel="canonical" href="https://ibadecomerce.firebaseapp.com/shops.html">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-utensils"></i> Ibad Foodz</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="shops.html">Restaurants</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart me-1"></i>Cart</a></li>
                    <li class="nav-item" id="nav-orders"><a class="nav-link" href="customer-orders.html">My Orders</a></li>
                    <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item" id="nav-register"><a class="nav-link" href="register-customer.html">Register</a></li>
                    <li class="nav-item" id="nav-profile"><a class="nav-link" href="profile.html"><i class="fas fa-user me-1"></i>Profile</a></li>
                    <li class="nav-item" id="nav-logout"><a class="nav-link" href="#" onclick="auth.logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <h1>Explore Restaurants</h1>
            <p class="lead mb-0">Discover delicious food from top restaurants near you</p>
        </div>
    </section>

    <div class="container">
        <h2 class="section-title">🍽️ All Restaurants</h2>
        <div class="row" id="restaurants-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        function updateNav() {
            const hide = (id) => { const el = document.getElementById(id); if (el) el.style.display = 'none'; };
            const show = (id) => { const el = document.getElementById(id); if (el) el.style.display = 'block'; };
            if (auth.currentUser) {
                show('nav-logout');
                hide('nav-login');
                hide('nav-register');
                show('nav-orders');
                show('nav-profile');
            } else {
                hide('nav-logout');
                show('nav-login');
                show('nav-register');
                hide('nav-orders');
                hide('nav-profile');
            }
        }

        async function loadRestaurants() {
            await auth.init();
            if (auth.currentUser) {
                document.getElementById('nav-logout').style.display = 'block';
                document.getElementById('nav-login').style.display = 'none';
                document.getElementById('nav-register').style.display = 'none';
            }
            updateNav();
            const container = document.getElementById('restaurants-list');
            container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const snapshot = await db.ref('restaurants').once('value');
                container.innerHTML = '';
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const r = child.val();
                        const isOnline = r.isOnline !== false;
                        const banner = r.banner || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600';
                        const logo = r.logo || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=150';
                        const offer = r.offer ? `<div class="offer-badge">${r.offer}</div>` : '';
                        const onclick = isOnline ? `window.location.href='restaurant-detail.html?id=${child.key}'` : '';
                        const div = document.createElement('div');
                        div.className = 'col-lg-3 col-md-4 col-sm-6 mb-4';
                        div.innerHTML = `
                            <div class="restaurant-card" data-id="${child.key}" style="cursor:${isOnline ? 'pointer' : 'not-allowed'}; position: relative; ${isOnline ? '' : 'opacity:0.7;filter:grayscale(80%);'}" onclick="${onclick}">
                                ${isOnline ? '' : '<div class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="background:rgba(0,0,0,0.45);z-index:2;"><span class="badge bg-danger fs-6">Currently Offline</span></div>'}
                                <div class="banner-wrap">
                                    <img src="${banner}" alt="${r.name}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600'">
                                    ${offer}
                                    <div class="logo-wrap"><img src="${logo}" alt="${r.name}" onerror="this.src='https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=150'"></div>
                                </div>
                                <div class="card-body">
                                    <h5>${r.name}</h5>
                                    <p class="text-muted small mb-2">${r.cuisine || 'Multi-Cuisine'}</p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="rating"><i class="fas fa-star me-1"></i>${r.rating || '4.0'}</span>
                                        <span class="delivery-time"><i class="fas fa-clock me-1"></i>${r.deliveryTime || '30'} mins</span>
                                    </div>
                                    <p class="text-muted small mt-2 mb-0">${r.address || ''}</p>
                                </div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                }
                if (!snapshot.exists()) {
                    container.innerHTML = '<div class="col-12 text-center py-5"><div class="empty-state"><i class="fas fa-store"></i><h4>No Restaurants Yet</h4><p class="text-muted">Be the first to register your restaurant!</p></div></div>';
                }
            } catch (e) { container.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRestaurants();
        });
    </script>
</body>
</html>
