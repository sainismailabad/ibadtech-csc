<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Ibad Foodie</title>
    <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-light">

  <!-- NAVBAR (simple) -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-utensils"></i> Ibad Foodie</a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <a class="btn btn-outline-primary btn-sm" href="customer-orders.html" id="btn-orders" style="display:none;">
          <i class="fas fa-receipt me-1"></i>Orders
        </a>
        <button class="btn btn-outline-danger btn-sm" onclick="auth.logout()">
          <i class="fas fa-sign-out-alt me-1"></i>Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:90px;">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
          <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5" style="background: var(--bg-gradient); color:white; border-radius: 18px;">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
              <div>
                <h3 class="fw-bold mb-2"><i class="fas fa-user me-2"></i>Your Profile</h3>
                <p class="mb-0 opacity-75" id="profile-role">Loading...</p>
              </div>
              <div class="text-end">
                <div class="badge bg-white text-dark fs-6 px-3 py-2" id="profile-email">-</div>
              </div>
            </div>

            <hr class="border-light opacity-25 my-4" />

            <div id="auth-required" class="alert alert-warning d-none" style="background: rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.25);">
              Please <a href="login.html" class="text-white fw-bold">login</a>.
            </div>

            <div class="mt-3">
              <form id="profile-form" class="mt-0">

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-signature"></i></span>
                    <input type="text" class="form-control" id="profile-name" placeholder="Your name" />
                  </div>
                </div>


                <div class="col-md-6">
                  <label class="form-label">Phone Number</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                    <input type="tel" class="form-control" id="profile-phone" placeholder="10-digit mobile" />
                  </div>
                </div>


                <div class="col-md-12">
                  <label class="form-label">Email</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="profile-email-input" disabled />
                  </div>
                </div>

                <div class="col-md-12">
                  <label class="form-label">Address</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-location-dot"></i></span>
                    <textarea class="form-control" id="profile-address" rows="2" placeholder="House/Flat, Street, Landmark"></textarea>
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">City</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-city"></i></span>
                    <input type="text" class="form-control" id="profile-city" placeholder="Your city" />
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Pincode</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-map-pin"></i></span>
                    <input type="text" class="form-control" id="profile-pincode" placeholder="6-digit pincode" />
                  </div>
                </div>
              </div>

              <div class="mt-4" id="extra-fields"></div>

              <div class="d-flex gap-2 flex-wrap mt-3">
                <button type="submit" class="btn btn-light btn-lg fw-bold px-4">
                  <i class="fas fa-save me-2"></i>Save Profile
                </button>
                <button type="button" class="btn btn-outline-light btn-lg fw-bold px-4" onclick="loadProfile()">
                  <i class="fas fa-rotate me-2"></i>Reset
                </button>
              </div>

              <div id="profile-msg" class="mt-3 d-none"></div>
            </form>

            <!-- Orders (Customer) -->
            <div class="mt-4">
              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div>
                  <h4 class="fw-bold mb-0"><i class="fas fa-receipt me-2"></i>Your Orders</h4>
                  <small class="text-white-50">Track delivery status and view item-wise details</small>
                </div>
              </div>

              <div id="orders-auth-required" class="alert alert-warning d-none">
                Please <a href="login.html" class="fw-bold">login</a> to view orders.
              </div>

              <div id="order-summary" class="row g-2 mb-3"></div>

              <div class="card border-0 shadow-sm">
                <div class="card-body">
                  <div class="table-responsive">
                    <table class="table table-hover align-middle">
                      <thead>
                        <tr>
                          <th>Order</th>
                          <th>Restaurant</th>
                          <th>Items</th>
                          <th>Amount</th>
                          <th>Status</th>
                          <th>Date</th>
                          <th class="text-center">Action</th>
                        </tr>
                      </thead>
                      <tbody id="customer-orders-table"></tbody>
                    </table>
                  </div>
                </div>
              </div>

              <div id="profile-orders-empty" class="empty-state d-none">
                <i class="fas fa-box-open"></i>
                <h4>No Orders Yet</h4>
                <p class="text-muted">Order your first meal! 🍕</p>
                <a href="index.html" class="btn btn-primary mt-3">Browse Restaurants</a>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>

  <script>
    function roleLabel(role) {
      if (role === 'customer') return 'Customer (Ordering)';
      if (role === 'seller') return 'Restaurant Owner';
      if (role === 'delivery') return 'Delivery Partner';
      if (role === 'admin') return 'Admin';
      return role || 'User';
    }

    function renderExtraFields(role) {
      const extra = document.getElementById('extra-fields');
      extra.innerHTML = '';

      if (role === 'seller') {
        extra.innerHTML = `
          <hr class="border-light opacity-25 my-4" />
          <h5 class="mb-3"><i class="fas fa-store me-2"></i>Restaurant Profile (optional)</h5>
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Restaurant Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-store"></i></span>
                <input type="text" class="form-control" id="rest-name" placeholder="Restaurant name" />
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Cuisine</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-utensils"></i></span>
                <input type="text" class="form-control" id="rest-cuisine" placeholder="Cuisine" />
              </div>
            </div>
            <div class="col-md-12">
              <label class="form-label">Restaurant Address</label>
              <textarea class="form-control" id="rest-address" rows="2" placeholder="Address"></textarea>
            </div>
          </div>
        `;
      } else if (role === 'delivery') {
        extra.innerHTML = `
          <hr class="border-light opacity-25 my-4" />
          <h5 class="mb-3"><i class="fas fa-motorcycle me-2"></i>Delivery Profile (optional)</h5>
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label">Availability</label>
              <select class="form-select" id="delivery-availability">
                <option value="true">Available</option>
                <option value="false">Busy</option>
              </select>
            </div>
          </div>
        `;
      }
    }

    async function loadProfile() {
      const role = await auth.init().then(x => x.role);
      const user = auth.currentUser;

      const authRequired = document.getElementById('auth-required');
      if (!user) {
        authRequired.classList.remove('d-none');
        document.getElementById('profile-form').style.display = 'none';
        return;
      }

      document.getElementById('profile-role').textContent = roleLabel(role);
      document.getElementById('profile-email').textContent = auth.currentUser.email;
      document.getElementById('profile-email-input').value = auth.currentUser.email;
      document.getElementById('profile-form').style.display = 'block';

      renderExtraFields(role);

      // user profile
      const snap = await db.ref('users/' + user.uid + '/profile').once('value');
      const p = snap.val() || {};

      document.getElementById('profile-name').value = p.name || '';
      document.getElementById('profile-phone').value = p.phone || '';
      document.getElementById('profile-address').value = p.address || '';
      document.getElementById('profile-city').value = p.city || '';
      document.getElementById('profile-pincode').value = p.pincode || '';

      // role specific
      if (role === 'seller') {
        const restSnap = await db.ref('restaurants/' + user.uid).once('value');
        const r = restSnap.val() || {};
        const restName = document.getElementById('rest-name');
        const restCuisine = document.getElementById('rest-cuisine');
        const restAddress = document.getElementById('rest-address');
        if (restName) restName.value = r.name || '';
        if (restCuisine) restCuisine.value = r.cuisine || '';
        if (restAddress) restAddress.value = r.address || '';
      }

      if (role === 'delivery') {
        const delSnap = await db.ref('deliveryPartners/' + user.uid).once('value');
        const d = delSnap.val() || {};
        const sel = document.getElementById('delivery-availability');
        if (sel) sel.value = String(d.available !== false);
      }

      return true;
    }

    async function saveProfile(e) {
      e.preventDefault();
      const user = auth.currentUser;
      const role = await auth.init().then(x => x.role);

      const msg = document.getElementById('profile-msg');
      msg.classList.remove('d-none');
      msg.classList.remove('alert-success', 'alert-danger');

      try {
        const payload = {
          name: document.getElementById('profile-name').value.trim(),
          phone: document.getElementById('profile-phone').value.trim(),
          address: document.getElementById('profile-address').value.trim(),
          city: document.getElementById('profile-city').value.trim(),
          pincode: document.getElementById('profile-pincode').value.trim(),
        };

        await db.ref('users/' + user.uid + '/profile').update(payload);

        // role specific save
        if (role === 'seller') {
          const restPayload = {
            name: document.getElementById('rest-name').value.trim(),
            cuisine: document.getElementById('rest-cuisine').value.trim(),
            address: document.getElementById('rest-address').value.trim(),
          };
          await db.ref('restaurants/' + user.uid).update(restPayload);
        }

        if (role === 'delivery') {
          const available = document.getElementById('delivery-availability').value === 'true';
          await db.ref('deliveryPartners/' + user.uid).update({ available: available });
        }

        msg.innerHTML = '<i class="fas fa-check-circle me-2"></i> Profile saved successfully!';
        msg.classList.add('alert-success');
      } catch (err) {
        msg.textContent = 'Save failed: ' + (err && err.message ? err.message : err);
        msg.classList.add('alert-danger');
      }
    }

    function safeStatusClass(status) {
      return String(status || 'Pending').toLowerCase().replace(/\s+/g, '-');
    }

    function cancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      db.ref('orders/' + orderId)
        .update({ status: 'Cancelled', cancelledAt: firebase.database.ServerValue.TIMESTAMP })
        .then(() => loadOrdersOnly(auth.currentUser.uid))
        .catch(e => auth.showToast('Error: ' + (e && e.message ? e.message : e)));
    }

    function viewLocation(lat, lng) {
      // optional: profile page currently doesn't include map modal
      // You can extend later if needed.
      auth.showToast('Live location feature is available in My Orders page.');
    }

    async function loadOrdersOnly(userId) {
      const tbody = document.getElementById('customer-orders-table');
      const summary = document.getElementById('order-summary');
      const empty = document.getElementById('profile-orders-empty');

      if (!tbody) return;

      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>';
      if (summary) summary.innerHTML = '';
      if (empty) empty.classList.add('d-none');

      try {
        const snap = await db.ref('orders').orderByChild('customerId').equalTo(userId).once('value');
        tbody.innerHTML = '';

        if (!snap.exists()) {
          if (empty) empty.classList.remove('d-none');
          if (summary) summary.innerHTML = '';
          return;
        }

        const orders = [];
        let total = 0, pending = 0, delivered = 0, cancelled = 0;

        snap.forEach(child => {
          const o = child.val();
          const item = { id: child.key, ...o };
          orders.push(item);
          total += item.totalAmount || 0;
          if (item.status === 'Pending' || item.status === 'Preparing' || item.status === 'Shipped') pending++;
          else if (item.status === 'Delivered') delivered++;
          else if (item.status === 'Cancelled') cancelled++;
        });

        orders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        if (summary) {
          summary.innerHTML = `
            <div class="col-md-3 col-6 mb-2">
              <div class="card p-3 text-center">
                <h6 class="text-muted">📋 Total Orders</h6>
                <h3 class="fw-bold mb-0">${orders.length}</h3>
              </div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="card p-3 text-center">
                <h6 class="text-muted">🕐 Active</h6>
                <h3 class="fw-bold text-warning mb-0">${pending}</h3>
              </div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="card p-3 text-center">
                <h6 class="text-muted">✅ Delivered</h6>
                <h3 class="fw-bold text-success mb-0">${delivered}</h3>
              </div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="card p-3 text-center">
                <h6 class="text-muted">💰 Total Spent</h6>
                <h3 class="fw-bold text-primary mb-0">₹${(total || 0).toFixed(2)}</h3>
              </div>
            </div>
          `;
        }

        for (const o of orders) {
          const items = o.items ? o.items.map(i => `<small>${i.name} x${i.qty}</small>`).join('<br>') : 'N/A';
          const d = o.timestamp ? new Date(o.timestamp).toLocaleDateString() + ' ' + new Date(o.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'N/A';

          const isCancellable = o.status === 'Pending' || o.status === 'Preparing';
          const isCancelled = o.status === 'Cancelled';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>#${o.id.slice(-6)}</strong></td>
            <td>${o.restaurantName || 'N/A'}</td>
            <td>${items}</td>
            <td><strong>₹${(o.totalAmount || 0).toFixed(2)}</strong></td>
            <td><span class="status-badge status-${safeStatusClass(o.status)}">${o.status || 'Pending'}</span></td>
            <td><small>${d}</small></td>
            <td class="text-center">
              ${isCancellable ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelOrder('${o.id}')"><i class="fas fa-ban me-1"></i>Cancel</button>` : ''}
              ${isCancelled ? `<span class="badge bg-danger">Cancelled</span>` : ''}
              ${o.status === 'Delivered' ? `<span class="badge bg-success">✅ Delivered</span>` : ''}
            </td>
          `;
          tbody.appendChild(tr);
        }
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-danger text-center py-4">Error: ${e?.message || e}</td></tr>`;
      }
    }

    function listenNotifications(userId) {
      let initialLoad = true;
      db.ref('notifications')
        .orderByChild('userId')
        .equalTo(userId)
        .on('child_added', (snapshot) => {
          if (!initialLoad) {
            const notif = snapshot.val();
            if (notif && !notif.read) {
              if (notif.message) {
                auth.notify(notif.message);
              }
              auth.markNotificationRead(snapshot.key);
              loadOrdersOnly(userId);
            }
          }
        });
      setTimeout(() => initialLoad = false, 2500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const authState = await auth.init();
      document.getElementById('profile-form').addEventListener('submit', saveProfile);
      await loadProfile();

      // Only customer gets order table
      if (authState?.user) {
        const role = authState.role;
        const ordersSectionAuth = document.getElementById('orders-auth-required');
        if (ordersSectionAuth) ordersSectionAuth.classList.add('d-none');

        if (role === 'customer') {
          await loadOrdersOnly(authState.user.uid);
          listenNotifications(authState.user.uid);
        }
      }
    });
  </script>
</body>
</html>
