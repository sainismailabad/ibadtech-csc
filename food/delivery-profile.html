<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Partner Profile - Ibad Foodie</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-motorcycle"></i> Ibad Foodie</a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <button class="btn btn-outline-danger btn-sm" onclick="auth.logout()">
          <i class="fas fa-sign-out-alt me-1"></i>Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:90px;">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5" style="background: var(--bg-gradient); color:white; border-radius: 18px;">

            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
              <div>
                <h3 class="fw-bold mb-2"><i class="fas fa-motorcycle me-2"></i>Delivery Partner Profile</h3>
                <p class="mb-0 opacity-75" id="delivery-role">Loading...</p>
              </div>
              <div class="text-end">
                <div class="badge bg-white text-dark fs-6 px-3 py-2" id="delivery-email">-</div>
              </div>
            </div>

            <hr class="border-light opacity-25 my-4" />

            <div id="auth-required" class="alert alert-warning d-none" style="background: rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.25);">
              Please <a href="login.html" class="text-white fw-bold">login</a> as delivery partner.
            </div>

            <form id="delivery-profile-form" class="mt-2 d-none">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="delivery-name" placeholder="Your name" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone Number</label>
                  <input type="tel" class="form-control" id="delivery-phone" placeholder="10-digit mobile" />
                </div>

                <div class="col-md-12">
                  <label class="form-label">Address</label>
                  <textarea class="form-control" id="delivery-address" rows="2" placeholder="House/Flat, Street, Landmark"></textarea>
                </div>

                <div class="col-md-6">
                  <label class="form-label">City</label>
                  <input type="text" class="form-control" id="delivery-city" placeholder="Your city" />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Pincode</label>
                  <input type="text" class="form-control" id="delivery-pincode" placeholder="6-digit pincode" />
                </div>

                <div class="col-md-12">
                  <label class="form-label">Availability</label>
                  <select class="form-select" id="delivery-availability">
                    <option value="true">Available</option>
                    <option value="false">Busy</option>
                  </select>
                </div>

                <div class="col-md-12">
                  <label class="form-label">Bike Number</label>
                  <input type="text" class="form-control" id="delivery-bike" placeholder="e.g. MH12 AB 1234" />
                </div>
              </div>

              <div class="d-flex gap-2 flex-wrap mt-4">
                <button type="submit" class="btn btn-light btn-lg fw-bold px-4">
                  <i class="fas fa-save me-2"></i>Save Profile
                </button>
                <button type="button" class="btn btn-outline-light btn-lg fw-bold px-4" id="delivery-reset">
                  <i class="fas fa-rotate me-2"></i>Reset
                </button>
              </div>

              <div id="delivery-msg" class="mt-3 d-none"></div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>

  <script>
    async function loadDeliveryProfile() {
      const authState = await auth.init();
      const role = authState.role;
      const user = authState.user;

      const authRequired = document.getElementById('auth-required');
      const form = document.getElementById('delivery-profile-form');

      if (!user || role !== 'delivery') {
        authRequired.classList.remove('d-none');
        form.classList.add('d-none');
        return;
      }

      authRequired.classList.add('d-none');
      form.classList.remove('d-none');

      document.getElementById('delivery-role').textContent = 'Delivery Partner';
      document.getElementById('delivery-email').textContent = user.email || '-';

      // Load profile from users/<uid>/profile (general) + deliveryPartners/<uid>/ (delivery-specific)
      const userSnap = await db.ref('users/' + user.uid + '/profile').once('value');
      const p = userSnap.val() || {};

      const deliverySnap = await db.ref('deliveryPartners/' + user.uid).once('value');
      const dp = deliverySnap.val() || {};

      document.getElementById('delivery-name').value = p.name || '';
      document.getElementById('delivery-phone').value = p.phone || '';
      document.getElementById('delivery-address').value = p.address || '';
      document.getElementById('delivery-city').value = p.city || '';
      document.getElementById('delivery-pincode').value = p.pincode || '';

      document.getElementById('delivery-availability').value = String(dp.available !== false);
      document.getElementById('delivery-bike').value = dp.bikeNumber || '';

      window.__deliveryProfileCache = { p: { ...p }, dp: { ...dp } };
    }

    async function saveDeliveryProfile(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const msg = document.getElementById('delivery-msg');
      msg.classList.remove('d-none');
      msg.classList.remove('alert-success', 'alert-danger');

      try {
        const available = document.getElementById('delivery-availability').value === 'true';

        const generalPayload = {
          name: document.getElementById('delivery-name').value.trim(),
          phone: document.getElementById('delivery-phone').value.trim(),
          address: document.getElementById('delivery-address').value.trim(),
          city: document.getElementById('delivery-city').value.trim(),
          pincode: document.getElementById('delivery-pincode').value.trim(),
        };

        const deliveryPayload = {
          available: available,
          bikeNumber: document.getElementById('delivery-bike').value.trim(),
        };

        await db.ref('users/' + user.uid + '/profile').update(generalPayload);
        await db.ref('deliveryPartners/' + user.uid).update(deliveryPayload);

        msg.innerHTML = '<i class="fas fa-check-circle me-2"></i> Saved successfully!';
        msg.classList.add('alert-success');

        window.__deliveryProfileCache = {
          p: { ...generalPayload },
          dp: { ...deliveryPayload }
        };
      } catch (err) {
        msg.textContent = 'Save failed: ' + (err && err.message ? err.message : err);
        msg.classList.add('alert-danger');
      }
    }

    function resetDeliveryProfile() {
      const cache = window.__deliveryProfileCache;
      if (!cache) return;
      document.getElementById('delivery-name').value = cache.p.name || '';
      document.getElementById('delivery-phone').value = cache.p.phone || '';
      document.getElementById('delivery-address').value = cache.p.address || '';
      document.getElementById('delivery-city').value = cache.p.city || '';
      document.getElementById('delivery-pincode').value = cache.p.pincode || '';
      document.getElementById('delivery-availability').value = String(cache.dp.available !== false);
      document.getElementById('delivery-bike').value = cache.dp.bikeNumber || '';
    }

    document.getElementById('delivery-profile-form').addEventListener('submit', saveDeliveryProfile);
    document.getElementById('delivery-reset').addEventListener('click', resetDeliveryProfile);

    document.addEventListener('DOMContentLoaded', loadDeliveryProfile);
  </script>
</body>
</html>
