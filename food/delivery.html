<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partner - Ibad Foodie</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        .delivery-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; border-left: 4px solid var(--primary); transition: all 0.3s; }
        .delivery-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .delivery-card.accepted { border-left-color: var(--success); }
        .delivery-card.delivered { border-left-color: var(--info); opacity: 0.8; }
        .earnings-card { background: linear-gradient(135deg, #ff6b35, #ffb347); color: white; border-radius: 16px; padding: 24px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .status-dot.available { background: #2ecc71; }
        .status-dot.busy { background: #e74c3c; }
        .order-item { background: #f8f9fa; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        .new-order-flash { animation: flashBg 1s ease 3; }
        @keyframes flashBg { 0%,100% { background-color: inherit; } 50% { background-color: #fff3cd; } }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .navbar { box-shadow: 0 4px 18px rgba(0,0,0,0.18); }
        .navbar .btn, .navbar .badge { white-space: nowrap; }
        .tracking-active-badge { background: #22c55e; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>
    <audio id="notification-sound" preload="auto"></audio>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-motorcycle"></i> Ibad Foodie</a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span class="badge bg-warning text-dark fs-6 px-3 py-2 me-1" id="earnings-badge">₹0</span>
                <a href="delivery-history.html" class="btn btn-warning text-dark btn-sm me-1" title="Delivery History"><i class="fas fa-history"></i> History</a>
                <a href="delivery-profile.html" class="btn btn-warning text-dark btn-sm me-1" title="Edit Profile"><i class="fas fa-user-cog"></i> Profile Setting</a>
                <button class="btn btn-outline-danger btn-sm" onclick="auth.logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px;">
        <div id="auth-required" class="alert alert-warning" style="display:none;">Please <a href="login.html">login</a> as delivery partner.</div>
        <div id="delivery-content">
            <div class="row mb-4">
                <div class="col-md-8">
                    <div class="earnings-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4 class="fw-bold mb-1">🛵 Delivery Partner</h4>
                                <p class="mb-0 opacity-75" id="partner-name">Welcome!</p>
                                <small id="vehicle-badge" class="opacity-75"></small>
                            </div>
                            <div class="text-end">
                                <h2 class="fw-bold mb-0">₹<span id="total-earnings">0</span></h2>
                                <small>Total Earnings</small>
                                <div><small class="opacity-75" id="bank-info"></small></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 h-100">
                        <div class="d-flex justify-content-between align-items-center h-100">
                            <div>
                                <h6 class="text-muted mb-1">Status</h6>
                                <h4 class="fw-bold mb-0" id="status-text">🟢 Available</h4>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="availability-toggle" style="width:50px;height:25px;" checked onchange="Delivery.toggleAvailability(this.checked)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-4">
                <div class="col-md-3 col-6 mb-2"><div class="card p-3 text-center"><h6 class="text-muted">📋 Total Orders</h6><h3 class="fw-bold mb-0" id="total-orders">0</h3></div></div>
                <div class="col-md-3 col-6 mb-2"><div class="card p-3 text-center"><h6 class="text-muted">✅ Delivered</h6><h3 class="fw-bold text-success mb-0" id="delivered-count">0</h3></div></div>
                <div class="col-md-3 col-6 mb-2"><div class="card p-3 text-center"><h6 class="text-muted">🕐 Pending</h6><h3 class="fw-bold text-warning mb-0" id="pending-count">0</h3></div></div>
                <div class="col-md-3 col-6 mb-2"><div class="card p-3 text-center"><h6 class="text-muted">⭐ Rating</h6><h3 class="fw-bold text-primary mb-0" id="delivery-rating">5.0</h3></div></div>
            </div>
            <h4 class="section-title">📦 Assigned Orders</h4>
            <div id="orders-list"></div>
        </div>
    </div>

    <div class="modal fade" id="deliveryMapModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">📍 Route to Customer</h5><button type="button" class="btn btn-success btn-sm" id="open-navigation-btn"><i class="fas fa-directions me-1"></i>Open Navigation</button><button type="button" class="btn btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><div id="delivery-map" style="height:450px;"></div></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        const Delivery = {
            currentUser: null, map: null, marker: null, isAvailable: true,
            _lastKnownLat: null, _lastKnownLng: null, _ownLocationInterval: null,
            deliveryBoyOwnMarker: null, customerMarker: null, customerTrackingUnsub: null,
            _ringtoneTimers: null, _ringtoneActive: false,

            isOrderVisibleToDelivery: function(order) {
                if (!order || order.status === 'Delivered' || order.status === 'Cancelled') return false;
                if (!this.isAvailable && !order.deliveryPartnerId) return false;
                if (order.deliveryPartnerId === this.currentUser.uid) return true;
                return !order.deliveryPartnerId && (order.status === 'Preparing' || order.status === 'Out for Delivery');
            },

            // ===== EXACT DELIVERY FEE FROM ORDER =====
            getDeliveryEarning: function(order) {
                if (order && typeof order.deliveryFee === 'number' && order.deliveryFee > 0) return order.deliveryFee;
                return Math.max(20, (order.totalAmount || 0) * 0.05);
            },

            requestLocationPermission: function() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) { resolve(false); return; }
                    navigator.geolocation.getCurrentPosition(
                        (pos) => { this._lastKnownLat = pos.coords.latitude; this._lastKnownLng = pos.coords.longitude; resolve(true); },
                        (err) => { console.warn('Location error:', err.message); resolve(false); },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                });
            },

            init: async function() {
                const state = await auth.init();
                if (!state.user || state.role !== 'delivery') {
                    document.getElementById('auth-required').style.display = 'block';
                    document.getElementById('delivery-content').style.display = 'none';
                    return;
                }
                this.currentUser = state.user;
                this.requestNotificationPermission();
                setTimeout(() => { this.requestLocationPermission(); }, 1000);
                this.loadProfile();
                this.loadOrders();
                this.loadEarnings();
                let previousEligibleOrderIds = new Set();
                let lastRingTs = 0;
                db.ref('orders').on('value', async (snap) => {

                    const eligibleOrders = [];
                    if (snap.exists()) {
                        snap.forEach(child => {
                            const order = child.val();
                            if (this.isOrderVisibleToDelivery(order)) eligibleOrders.push({ id: child.key, ...order });
                        });
                    }
                    this.autoManageLiveTracking(eligibleOrders);
                    const currentEligibleOrderIds = new Set(eligibleOrders.map(o => o.id));
                    const newOrderIds = [...currentEligibleOrderIds].filter(id => !previousEligibleOrderIds.has(id));
                    if (previousEligibleOrderIds.size > 0 && newOrderIds.length > 0) {
                        this.playNewOrderRing();
                        this.showNewOrderToast();
                    }
                    previousEligibleOrderIds = currentEligibleOrderIds;
                    this.loadOrders();
                    this.loadEarnings();
                });
            },

            requestNotificationPermission: function() {
                if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
            },

            showEnableLocationDialog: function() {
                return new Promise((resolve) => {
                    const existing = document.getElementById('location-dialog-overlay');
                    if (existing) existing.remove();
                    const overlay = document.createElement('div');
                    overlay.id = 'location-dialog-overlay';
                    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.3s ease;';
                    const dialog = document.createElement('div');
                    dialog.style.cssText = 'background:white;border-radius:20px;padding:30px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);';
                    dialog.innerHTML = `<div style="font-size:3rem;margin-bottom:15px;">📍</div>
                        <h4 style="margin-bottom:10px;font-weight:700;">Enable Location</h4>
                        <p style="color:#666;margin-bottom:20px;">To deliver orders and share live tracking with customers, please allow location access when prompted.</p>
                        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                            <button id="loc-allow-btn" style="background:#ff6b35;color:white;border:none;padding:12px 28px;border-radius:12px;font-weight:700;cursor:pointer;font-size:1rem;">✅ Allow Location</button>
                            <button id="loc-skip-btn" style="background:#f1f1f1;color:#666;border:none;padding:12px 28px;border-radius:12px;font-weight:600;cursor:pointer;font-size:1rem;">Skip</button>
                        </div>`;
                    overlay.appendChild(dialog);
                    document.body.appendChild(overlay);
                    document.getElementById('loc-allow-btn').onclick = () => { overlay.remove(); this.requestLocationPermission().then(resolve); navigator.geolocation.getCurrentPosition(() => {}, () => {}); };
                    document.getElementById('loc-skip-btn').onclick = () => { overlay.remove(); resolve(false); };
                });
            },

            showNewOrderToast: function() {
                try {
                    const existing = document.getElementById('new-order-toast');
                    if (existing) existing.remove();
                    const toast = document.createElement('div');
                    toast.id = 'new-order-toast';
                    toast.style.cssText = 'position:fixed;top:80px;right:20px;z-index:9999;background:linear-gradient(135deg,#ff6b35,#e74c3c);color:white;padding:16px 24px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.3);display:block;max-width:380px;font-weight:700;animation:slideIn 0.3s ease;cursor:pointer;';
                    toast.innerHTML = '<div class="d-flex align-items-center gap-3"><div style="font-size:2rem;">🛵</div><div><div style="font-size:1.1rem;">🚀 New Delivery Order!</div><small style="opacity:0.9;">Scroll down to accept</small></div></div>';
                    toast.onclick = () => { toast.remove(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); };
                    document.body.appendChild(toast);
                    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 8000);
                } catch(e) {}
            },

            // ===== 20-SECOND RINGTONE (Zomato/Swiggy/Rapido-style) =====
            stopRingtone: function() {
                this._ringtoneActive = false;
                if (this._ringtoneTimers) {
                    if (this._ringtoneTimers.ringInterval) clearInterval(this._ringtoneTimers.ringInterval);
                    if (this._ringtoneTimers.titleInterval) clearInterval(this._ringtoneTimers.titleInterval);
                    if (this._ringtoneTimers.vibrateTimeout) clearTimeout(this._ringtoneTimers.vibrateTimeout);
                    this._ringtoneTimers = null;
                }
                if (navigator.vibrate) navigator.vibrate(0);
                document.title = 'Delivery Partner - Ibad Foodie';
            },

            playNewOrderRing: function() {
                if (this._ringtoneActive) return; // Don't overlap ringtones
                this._ringtoneActive = true;
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const now = audioCtx.currentTime;
                    for (let i = 0; i < 40; i++) {
                        const t = now + i * 0.5;
                        const o1 = audioCtx.createOscillator(); const g1 = audioCtx.createGain();
                        o1.connect(g1); g1.connect(audioCtx.destination);
                        o1.frequency.value = 880; o1.type = 'square';
                        g1.gain.setValueAtTime(0.35, t); g1.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                        o1.start(t); o1.stop(t + 0.15);
                        const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
                        o2.connect(g2); g2.connect(audioCtx.destination);
                        o2.frequency.value = 1100; o2.type = 'square';
                        g2.gain.setValueAtTime(0.35, t + 0.15); g2.gain.exponentialRampToValueAtTime(0.01, t + 0.30);
                        o2.start(t + 0.15); o2.stop(t + 0.30);
                        const o3 = audioCtx.createOscillator(); const g3 = audioCtx.createGain();
                        o3.connect(g3); g3.connect(audioCtx.destination);
                        o3.frequency.value = 660; o3.type = 'square';
                        g3.gain.setValueAtTime(0.35, t + 0.30); g3.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
                        o3.start(t + 0.30); o3.stop(t + 0.45);
                    }
                } catch(e) { try { auth.playNotificationSound(); } catch(e2) {} }

                this._ringtoneTimers = { ringInterval: null, titleInterval: null, vibrateTimeout: null };

                // Vibration pattern for 20 seconds
                if (navigator.vibrate) { const v = []; for (let i = 0; i < 20; i++) v.push(400, 200); navigator.vibrate(v); }

                if ('Notification' in window && Notification.permission === 'granted') {
                    try { new Notification('🛵 New Delivery Order!', { body: '🚀 A new order is available! Tap to accept.', icon: 'https://img.icons8.com/fluency/48/motorcycle.png', tag: 'new-order-' + Date.now(), requireInteraction: true, silent: true }); } catch(e) {}
                }
                const originalTitle = document.title;
                let idx = 0;
                const ti = setInterval(() => { document.title = idx++ % 2 === 0 ? '🛵 NEW ORDER!' : '🛵 Tap to Accept!'; }, 800);
                this._ringtoneTimers.titleInterval = ti;

                // Auto-stop after 20 seconds
                const autoStop = setTimeout(() => {
                    if (this._ringtoneActive) {
                        if (navigator.vibrate) navigator.vibrate(0);
                        clearInterval(ti);
                        document.title = originalTitle;
                        this._ringtoneActive = false;
                    }
                }, 20000);
                this._ringtoneTimers.vibrateTimeout = autoStop;
            },

            loadProfile: async function() {
                try {
                    const snap = await db.ref('deliveryPartners/' + this.currentUser.uid).once('value');
                    if (snap.exists()) {
                        const p = snap.val();
                        document.getElementById('partner-name').textContent = '👋 ' + (p.name || 'Delivery Partner');
                        document.getElementById('delivery-rating').textContent = p.rating || '5.0';
                        const vehicle = p.vehicleNo || p.bikeNumber || '';
                        if (vehicle) document.getElementById('vehicle-badge').textContent = '🚗 ' + vehicle;
                        if (p.bankAccount || p.upiId) {
                            document.getElementById('bank-info').innerHTML = '🏦 Bank: ' + (p.bankAccount ? 'Added' : '') + (p.upiId ? ' | UPI: Yes' : '');
                        } else {
                            document.getElementById('bank-info').innerHTML = '<a href="delivery-profile.html" style="color:white;text-decoration:underline;">Add Bank/UPI</a>';
                        }
                    }
                } catch(e) {}
            },

            toggleAvailability: function(available) {
                this.isAvailable = available;
                document.getElementById('status-text').innerHTML = available ? '🟢 Available' : '🔴 Busy';
                db.ref('deliveryPartners/' + this.currentUser.uid).update({ available: available });
            },

            loadOrders: async function() {
                const container = document.getElementById('orders-list');
                container.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
                try {
                    const snap = await db.ref('orders').once('value');
                    container.innerHTML = '';
                    let total = 0, delivered = 0, pending = 0;
                    if (snap.exists()) {
                        const orders = [];
                        snap.forEach(child => {
                            const o = child.val();
                            if (this.isOrderVisibleToDelivery(o)) orders.push({ id: child.key, ...o });
                        });
                        orders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        if (orders.length === 0) {
                            container.innerHTML = '<div class="text-center py-5"><i class="fas fa-box-open fa-3x text-muted mb-3"></i><h5>No Orders Available</h5><p class="text-muted">Wait for new orders - you will hear a ring! 🔔</p></div>';
                            return;
                        }
                        for (const o of orders) {
                            total++;
                            if (o.status === 'Delivered') delivered++;
                            else if (o.status === 'Preparing' || o.status === 'Shipped' || o.status === 'Out for Delivery') pending++;
                            const items = o.items ? o.items.map(i => `${i.name} x${i.qty}`).join(', ') : 'N/A';
                            const d = o.timestamp ? new Date(o.timestamp).toLocaleDateString() + ' ' + new Date(o.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : 'N/A';
                            const isMyOrder = o.deliveryPartnerId === this.currentUser.uid;
                            const deliveryEarning = this.getDeliveryEarning(o);
                            const isTracking = this.trackingOrderId === o.id;
                            
                            const div = document.createElement('div');
                            div.className = `delivery-card ${!isMyOrder && !o.deliveryPartnerId ? 'new-order-flash' : ''}`;
                            div.style.animation = !isMyOrder && !o.deliveryPartnerId ? 'flashBg 1.5s ease 3' : '';
                            div.innerHTML = `
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <h5 class="fw-bold mb-1">#${o.id.slice(-6)} ${!isMyOrder && !o.deliveryPartnerId ? '<span class="badge bg-danger ms-2">NEW!</span>' : ''} ${isTracking ? '<span class="tracking-active-badge ms-2"><i class="fas fa-satellite-dish"></i> LIVE</span>' : ''}</h5>
                                        <p class="text-muted mb-1"><i class="fas fa-store me-1"></i>${o.restaurantName || 'Restaurant'}</p>
                                        <p class="text-muted mb-1"><small><i class="fas fa-user me-1"></i>${o.customerName || 'Customer'}</small></p>
                                    </div>
                                    <span class="status-badge status-${String(o.status || '').toLowerCase().replace(/[^a-z0-9]+/g, '-')}">${o.status}</span>
                                </div>
                                <div class="order-item"><small><strong>Items:</strong> ${items}</small></div>
                                <p class="mb-1"><small><i class="fas fa-map-marker-alt me-1"></i>${o.deliveryAddress || 'N/A'}, ${o.city || ''}</small></p>
                                <p class="mb-1"><small class="text-muted"><i class="fas fa-phone me-1"></i>${o.customerPhone || 'N/A'}</small></p>
                                <p class="mb-2"><strong>Amount:</strong> ₹${(o.totalAmount || 0).toFixed(2)} | <small>${d}</small> | <span class="text-muted">💰 Earn: ₹${deliveryEarning.toFixed(2)}</span></p>
                                <div class="d-flex gap-2 flex-wrap">
                                    ${!o.deliveryPartnerId && o.status === 'Preparing' ? `<button class="btn btn-primary btn-lg" onclick="Delivery.acceptOrder('${o.id}')" style="flex:1;"><i class="fas fa-check me-2"></i>Accept Delivery 🛵</button>` : ''}
                                    ${isMyOrder && (o.status === 'Shipped' || o.status === 'Out for Delivery') ? `<button class="btn btn-success btn-lg" onclick="Delivery.markDelivered('${o.id}')" style="flex:1;"><i class="fas fa-check-circle me-2"></i>Mark Delivered ✅</button>` : ''}
                                    ${o.customerLat && o.customerLng ? `<button class="btn btn-outline-info btn-sm" onclick="Delivery.viewRoute(${o.customerLat}, ${o.customerLng})"><i class="fas fa-map me-1"></i>Route</button><button class="btn btn-outline-success btn-sm" onclick="Delivery.openNavigation(${o.customerLat}, ${o.customerLng})"><i class="fas fa-directions me-1"></i>Navigate</button>` : ''}
                                    ${o.customerPhone ? `<a href="tel:${o.customerPhone}" class="btn btn-outline-primary btn-sm"><i class="fas fa-phone me-1"></i>Call</a>` : ''}
                                </div>
                            `;
                            container.appendChild(div);
                        }
                    }
                    document.getElementById('total-orders').textContent = total;
                    document.getElementById('delivered-count').textContent = delivered;
                    document.getElementById('pending-count').textContent = pending;
                } catch (e) { container.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
            },

            acceptOrder: async function(orderId) {
                // Stop ringtone immediately when delivery boy accepts
                this.stopRingtone();
                try {
                    const availabilitySnap = await db.ref('orders/' + orderId).once('value');
                    if (!availabilitySnap.exists() || !this.isOrderVisibleToDelivery(availabilitySnap.val())) {
                        auth.showToast('This order is no longer available for delivery.');
                        this.loadOrders(); return;
                    }
                    const dpSnap = await db.ref('deliveryPartners/' + this.currentUser.uid).once('value');
                    const dp = dpSnap.val() || {};
                    const orderRef = db.ref('orders/' + orderId);
                    let didAccept = false;
                    await orderRef.transaction((current) => {
                        if (!current) return current;
                        if (current.deliveryPartnerId && current.deliveryPartnerId !== this.currentUser.uid) return current;
                        if (current.status === 'Delivered' || current.status === 'Cancelled') return current;
                        didAccept = true;
                        return { ...current, status: 'Shipped', deliveryPartnerId: this.currentUser.uid,
                            deliveryPartnerName: dp.name || 'Delivery Partner', deliveryPartnerPhone: dp.phone || '',
                            deliveryPartnerVehicle: dp.vehicleNo || dp.bikeNumber || '', acceptedAt: firebase.database.ServerValue.TIMESTAMP };
                    });
                    if (!didAccept) { auth.showToast('Someone else accepted this delivery just now.'); this.loadOrders(); return; }
                    const locGranted = await this.requestLocationPermission();
                    if (!locGranted) {
                        const dialogResult = await this.showEnableLocationDialog();
                        if (!dialogResult) auth.showToast('⚠️ Location tracking not enabled. Customer will not see your live location.');
                    }
                    this.startLiveTracking(orderId);
                    const orderSnap = await db.ref('orders/' + orderId).once('value');
                    const order = orderSnap.val();
                    if (order && order.customerId) {
                        const msg = `🛵 Delivery partner ${dp.name || ''} is on the way! 📞 ${dp.phone || ''} 🚗 ${dp.vehicleNo || dp.bikeNumber || ''}`;
                        auth.addNotification(order.customerId, msg, 'delivery');
                        auth.notify(msg);
                    }
                    this.loadOrders();
                    this.loadEarnings();
                } catch (e) { auth.showToast('Error: ' + e.message); }
            },

            // ===== EXACT DELIVERY FEE FROM ORDER ON MARK DELIVERED =====
            markDelivered: async function(orderId) {
                if (confirm('Mark this order as delivered? 💰 You will earn the delivery fee!')) {
                    try {
                        await db.ref('orders/' + orderId).update({ status: 'Delivered', deliveredAt: firebase.database.ServerValue.TIMESTAMP });
                        this.stopLiveTracking();
                        const snap = await db.ref('orders/' + orderId).once('value');
                        const orderData = snap.val();
                        // Use exact delivery fee from the order (what customer paid)
                        const deliveryFee = (orderData && typeof orderData.deliveryFee === 'number' && orderData.deliveryFee > 0)
                            ? orderData.deliveryFee
                            : Math.max(25, (orderData.totalAmount || 0) * 0.05);
                        const partnerRef = db.ref('deliveryPartners/' + this.currentUser.uid);
                        await partnerRef.child('earnings').transaction(current => (current || 0) + deliveryFee);
                        await partnerRef.child('totalDeliveries').transaction(current => (current || 0) + 1);
                        const historyRef = db.ref('deliveryHistory').push();
                        await historyRef.set({ deliveryPartnerId: this.currentUser.uid, orderId: orderId, amount: deliveryFee, deliveredAt: firebase.database.ServerValue.TIMESTAMP });
                        if (orderData.customerId) {
                            // Notify customer to rate
                            auth.addNotification(orderData.customerId, '✅ Your order has been delivered! Please rate the delivery boy and products ⭐', 'order');
                            auth.addNotification(orderData.customerId, 'show_rating_popup_' + orderId, 'rating');
                            auth.notify('✅ Order delivered! Please rate your experience ⭐');
                        }
                        auth.addNotification(orderId, '✅ Order delivered! ₹' + deliveryFee.toFixed(2) + ' earned! 💰', 'delivery');
                        this.loadOrders();
                        this.loadEarnings();
                    } catch (e) { auth.showToast('Error: ' + e.message); }
                }
            },

            loadEarnings: async function() {
                try {
                    const snap = await db.ref('deliveryPartners/' + this.currentUser.uid).once('value');
                    if (snap.exists()) {
                        const dp = snap.val();
                        const earnings = dp.earnings || 0;
                        document.getElementById('total-earnings').textContent = earnings.toFixed(2);
                        document.getElementById('earnings-badge').textContent = '₹' + earnings.toFixed(2) + ' | ' + (dp.totalDeliveries || 0) + ' trips';
                    }
                } catch (e) {}
            },

            // ====== BACKGROUND LIVE LOCATION TRACKING ======
            trackingInterval: null, trackingOrderId: null, trackingWatchId: null,
            trackingStartTime: null, wakeLock: null, trackingRef: null,
            _running: false, _lastUpdateTime: 0,

            _acquireWakeLock: async function() {
                try {
                    if ('wakeLock' in navigator) {
                        this.wakeLock = await navigator.wakeLock.request('screen');
                        this.wakeLock.addEventListener('release', () => { if (this._running) setTimeout(() => this._acquireWakeLock(), 1000); });
                    }
                } catch(e) { console.warn('Wake lock error:', e.message || e); }
            },
            _releaseWakeLock: function() { if (this.wakeLock) { try { this.wakeLock.release(); } catch(e) {} this.wakeLock = null; } },

            _updateLocationOnce: function() {
                if (!this._running || !this.trackingOrderId || !this.trackingRef) return;
                if (this.trackingStartTime && (Date.now() - this.trackingStartTime) > 1800000) { this.stopLiveTracking(); auth.showToast('⏰ Live tracking auto-stopped after 30 minutes'); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => { if (!this._running) return; const now = Date.now(); this._lastUpdateTime = now; this.trackingRef.update({ lat: pos.coords.latitude, lng: pos.coords.longitude, lastUpdated: now }); },
                    (err) => { console.warn('Location update failed:', err.message); },
                    { enableHighAccuracy: true, timeout: 12000, maximumAge: 5000 }
                );
            },

            isOrderTrackableForMe: function(order) {
                if (!order || !this.currentUser || !order.deliveryPartnerId) return false;
                if (order.deliveryPartnerId !== this.currentUser.uid) return false;
                return order.status === 'Shipped' || order.status === 'Out for Delivery';
            },

            shouldStopLiveTracking: function(order) {
                if (!this.trackingOrderId) return false;
                if (!order) return true;
                if (order.deliveryPartnerId !== this.currentUser.uid) return true;
                if (order.status === 'Delivered' || order.status === 'Cancelled') return true;
                if (this.trackingStartTime && (Date.now() - this.trackingStartTime) > 1800000) return true;
                return false;
            },

            autoManageLiveTracking: function(eligibleOrders) {
                try {
                    if (!this.currentUser) return;
                    const currentTracked = this.trackingOrderId ? eligibleOrders.find(o => o.id === this.trackingOrderId) : null;
                    if (this.shouldStopLiveTracking(currentTracked)) { this.stopLiveTracking(); return; }
                    if (this.trackingOrderId) { if (currentTracked && this.isOrderTrackableForMe(currentTracked)) return; this.stopLiveTracking(); }
                    const trackable = eligibleOrders.filter(o => this.isOrderTrackableForMe(o)).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    if (trackable.length > 0) this.startLiveTracking(trackable[0].id);
                } catch (e) { console.warn('autoManageLiveTracking error:', e && e.message ? e.message : e); }
            },

            startLiveTracking: function(orderId) {
                if (!navigator.geolocation) { auth.showToast('Geolocation is not supported on this device.'); return; }
                this.stopLiveTracking();
                this.trackingOrderId = orderId; this.trackingStartTime = Date.now();
                this.trackingRef = db.ref('deliveryTracking/' + orderId); this._running = true;
                this._acquireWakeLock();
                this._visibilityHandler = () => { if (document.visibilityState === 'visible' && this._running) { this._updateLocationOnce(); this._acquireWakeLock(); } };
                document.addEventListener('visibilitychange', this._visibilityHandler);
                navigator.geolocation.getCurrentPosition(
                    (initialPos) => {
                        if (!this._running) return;
                        const lat = initialPos.coords.latitude; const lng = initialPos.coords.longitude;
                        this._lastUpdateTime = Date.now();
                        this.trackingRef.set({ active: true, deliveryPartnerId: this.currentUser.uid, lat: lat, lng: lng, lastUpdated: this._lastUpdateTime });
                        this.trackingInterval = setInterval(() => { this._updateLocationOnce(); }, 5000);
                        auth.showToast('📍 Live tracking started! Customer can see your real-time location.');
                        this.loadOrders();
                    },
                    (err) => { this._running = false; auth.showToast('Could not get your location: ' + err.message + '. Please enable GPS and try again.'); },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
                );
            },

            stopLiveTracking: function() {
                this._running = false; this._releaseWakeLock();
                if (this._visibilityHandler) { document.removeEventListener('visibilitychange', this._visibilityHandler); this._visibilityHandler = null; }
                if (this.trackingWatchId !== null) { navigator.geolocation.clearWatch(this.trackingWatchId); this.trackingWatchId = null; }
                if (this.trackingInterval) { clearInterval(this.trackingInterval); this.trackingInterval = null; }
                if (this.trackingOrderId && this.trackingRef) { this.trackingRef.update({ active: false }); this.trackingOrderId = null; this.trackingStartTime = null; this.trackingRef = null; }
            },

            _createDeliveryBoyPin: function() {
                return L.divIcon({ className: 'delivery-boy-map-icon',
                    html: `<div style="font-size:32px;text-align:center;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));"><svg width="32" height="32" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#FF6B35" stroke="#fff" stroke-width="3"/><text x="50" y="62" text-anchor="middle" font-size="48">🛵</text></svg></div>`,
                    iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -19] });
            },
            _createCustomerSavedPin: function() {
                return L.divIcon({ className: 'customer-saved-map-icon',
                    html: `<div style="position:relative;"><div style="width:22px;height:22px;background:#2563eb;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(37,99,235,0.5);"></div><div style="position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #2563eb;"></div></div>`,
                    iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -18] });
            },
            _createCustomerLivePin: function() {
                return L.divIcon({ className: 'customer-live-map-icon',
                    html: `<div style="position:relative;"><div style="width:18px;height:18px;background:#2563eb;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(37,99,235,0.5);animation:pulse 2s infinite;"></div><div style="position:absolute;top:-6px;left:-6px;width:30px;height:30px;background:rgba(37,99,235,0.12);border-radius:50%;"></div></div>`,
                    iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -18] });
            },

            viewRoute: function(lat, lng) {
                this.navigationUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(lat + ',' + lng);
                document.getElementById('open-navigation-btn').onclick = () => window.open(this.navigationUrl, '_blank');
                const modal = new bootstrap.Modal(document.getElementById('deliveryMapModal'));
                const that = this;
                setTimeout(() => {
                    if (!this.map) { this.map = L.map('delivery-map').setView([lat, lng], 14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(this.map); }
                    else { this.map.setView([lat, lng], 14); }
                    if (this.deliveryBoyOwnMarker) this.map.removeLayer(this.deliveryBoyOwnMarker); this.deliveryBoyOwnMarker = null;
                    if (this._lastKnownLat && this._lastKnownLng) {
                        this.deliveryBoyOwnMarker = L.marker([this._lastKnownLat, this._lastKnownLng], { icon: that._createDeliveryBoyPin() }).addTo(this.map).bindPopup('<strong>🛵 You (Live)</strong>').openPopup();
                    }
                    if (this._ownLocationInterval) clearInterval(this._ownLocationInterval);
                    this._ownLocationInterval = setInterval(() => {
                        if (!that.map) return;
                        navigator.geolocation.getCurrentPosition(
                            (pos) => { that._lastKnownLat = pos.coords.latitude; that._lastKnownLng = pos.coords.longitude;
                                if (!that.deliveryBoyOwnMarker) { that.deliveryBoyOwnMarker = L.marker([that._lastKnownLat, that._lastKnownLng], { icon: that._createDeliveryBoyPin() }).addTo(that.map).bindPopup('<strong>🛵 You (Live)</strong>'); }
                                else { that.deliveryBoyOwnMarker.setLatLng([that._lastKnownLat, that._lastKnownLng]); }
                                const group = []; if (that.deliveryBoyOwnMarker) group.push(that.deliveryBoyOwnMarker); if (that.customerMarker) group.push(that.customerMarker);
                                if (that.customerMarker) { try { const bounds = L.featureGroup(group).getBounds(); if (bounds.isValid()) that.map.fitBounds(bounds, { padding: [60, 60], maxZoom: 16, animate: true }); } catch(e) {} } },
                            () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
                        );
                    }, 5000);
                    if (this.customerMarker) this.map.removeLayer(this.customerMarker);
                    this.customerMarker = L.marker([lat, lng], { icon: that._createCustomerSavedPin() }).addTo(this.map).bindPopup('📍 Customer Location (Saved)').openPopup();
                    if (this.trackingOrderId) {
                        const orderId = this.trackingOrderId;
                        if (this.customerTrackingUnsub) { try { this.customerTrackingUnsub(); } catch(e) {} this.customerTrackingUnsub = null; }
                        const ref = db.ref('customerTracking/' + orderId);
                        this.customerTrackingUnsub = ref.on('value', (snap) => {
                            const data = snap.val() || {};
                            if (typeof data.lat === 'number' && typeof data.lng === 'number') {
                                if (data.active) { if (that.customerMarker) { that.customerMarker.setLatLng([data.lat, data.lng]); that.customerMarker.setIcon(that._createCustomerLivePin()); that.customerMarker.setPopupContent('<strong>📍 Customer (Live)</strong>'); } }
                                else { if (that.customerMarker) { that.customerMarker.setLatLng([lat, lng]); that.customerMarker.setIcon(that._createCustomerSavedPin()); that.customerMarker.setPopupContent('📍 Customer Location (Saved)'); } }
                                const group = []; if (that.deliveryBoyOwnMarker) group.push(that.deliveryBoyOwnMarker); if (that.customerMarker) group.push(that.customerMarker);
                                try { const bounds = L.featureGroup(group).getBounds(); if (bounds.isValid()) that.map.fitBounds(bounds, { padding: [60, 60], maxZoom: 16, animate: true }); } catch(e) {}
                            }
                        });
                    }
                }, 300);
                modal.show();
                document.getElementById('deliveryMapModal').addEventListener('hidden.bs.modal', function() {
                    if (that._ownLocationInterval) { clearInterval(that._ownLocationInterval); that._ownLocationInterval = null; }
                    if (that.customerTrackingUnsub) { try { that.customerTrackingUnsub(); } catch(e) {} that.customerTrackingUnsub = null; }
                    if (that.deliveryBoyOwnMarker) { that.map.removeLayer(that.deliveryBoyOwnMarker); that.deliveryBoyOwnMarker = null; }
                    if (that.customerMarker) { that.map.removeLayer(that.customerMarker); that.customerMarker = null; }
                }, { once: true });
            },

            openNavigation: function(lat, lng) {
                window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(lat + ',' + lng), '_blank');
            }
        };

        document.addEventListener('DOMContentLoaded', () => Delivery.init());
    </script>
