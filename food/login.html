<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ibad Foodz | Food Delivery</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Professional Login Animations */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes slideInRight {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .login-card {
            animation: fadeSlideUp 0.5s ease;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .login-card .card-body {
            padding: 40px 32px;
        }
        .login-card .form-control {
            border-radius: 10px;
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .login-card .form-control:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 4px rgba(255,107,53,0.12);
        }
        .login-card .input-group-text {
            border-radius: 10px 0 0 10px;
            border: 2px solid #e5e7eb;
            border-right: none;
            background: #f9fafb;
            color: #9ca3af;
        }
        .login-card .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .login-card .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,107,53,0.35);
        }
        .login-card .btn-primary:disabled {
            opacity: 0.7;
            transform: none;
        }
        /* Error Toast Dialog */
        .error-toast-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        .error-toast-dialog {
            background: white;
            border-radius: 20px;
            padding: 32px 28px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.2);
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .error-toast-dialog .error-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.8rem;
        }
        .error-toast-dialog .error-icon.danger {
            background: #fce4ec;
            color: #e11d48;
        }
        .error-toast-dialog .error-icon.warning {
            background: #fef3c7;
            color: #d97706;
        }
        .error-toast-dialog h4 {
            font-weight: 800;
            font-size: 1.15rem;
            color: #1a1d23;
            margin-bottom: 8px;
        }
        .error-toast-dialog p {
            color: #6b7280;
            font-size: 0.88rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .error-toast-dialog .btn-dismiss {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 32px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .error-toast-dialog .btn-dismiss:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(255,107,53,0.3);
        }
        /* Loading spinner */
        .login-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px;
        }
        .login-loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f4f6;
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .login-loading p {
            color: #6b7280;
            font-weight: 600;
            font-size: 0.9rem;
        }
        /* Success animation */
        .success-check {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #d1fae5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.8rem;
            color: #16a34a;
            animation: pulse 0.6s ease 2;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="navbar-brand" style="font-size:1.6rem;font-weight:800;color:#ff6b35;text-decoration:none;"><i class="fas fa-utensils"></i> Ibad Foodz</a>
                </div>
                <div class="card login-card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div style="font-size:3rem;line-height:1;">🍕</div>
                            <h3 class="card-title fw-bold mt-3" style="color:#1a1d23;">Welcome Back!</h3>
                            <p class="text-muted" style="font-size:0.9rem;">Sign in to continue ordering food</p>
                        </div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold" style="font-size:0.82rem;color:#374151;">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required autocomplete="email">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold" style="font-size:0.82rem;color:#374151;">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <button type="button" class="btn btn-link p-0" onclick="openForgetPasswordModal()" style="color:#ff6b35;font-weight:700;text-decoration:none;font-size:0.85rem;">Forgot Password?</button>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg" id="login-submit-btn">Sign In</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0" style="color:#6b7280;font-size:0.85rem;">Don't have an account? <a href="register-customer.html" class="fw-bold" style="color:#ff6b35;text-decoration:none;">Create Account</a></p>
                        </div>
                        
                        <!-- Loading overlay (hidden by default) -->
                        <div id="login-loading" class="login-loading d-none">
                            <div class="spinner"></div>
                            <p>Signing you in to Ibad Foodz...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgetPasswordModal" tabindex="-1" aria-labelledby="forgetPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius:16px;border:none;box-shadow:0 20px 60px rgba(0,0,0,0.15);">
                <div class="modal-header" style="border-bottom:1px solid #f3f4f6;">
                    <h5 class="modal-title fw-bold" id="forgetPasswordModalLabel" style="color:#1a1d23;">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="reset-email" class="form-label fw-bold" style="font-size:0.82rem;">Enter your email</label>
                        <input type="email" class="form-control" id="reset-email" placeholder="example@email.com" style="border-radius:10px;border:2px solid #e5e7eb;padding:10px 14px;" />
                    </div>
                    <div id="reset-password-msg" class="alert d-none" role="alert" style="border-radius:10px;border:none;"></div>
                </div>
                <div class="modal-footer" style="border-top:1px solid #f3f4f6;">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius:10px;font-weight:600;padding:8px 20px;">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="handlePasswordReset()" style="border-radius:10px;font-weight:600;padding:8px 20px;background:linear-gradient(135deg,#ff6b35,#ff8c42);border:none;">Send Reset Link</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        function openForgetPasswordModal() {
            const modalEl = document.getElementById('forgetPasswordModal');
            const modal = new bootstrap.Modal(modalEl);
            const msg = document.getElementById('reset-password-msg');
            msg.classList.add('d-none');
            msg.className = 'alert d-none';
            modal.show();
        }

        async function handlePasswordReset() {
            const email = (document.getElementById('reset-email').value || '').trim();
            const msg = document.getElementById('reset-password-msg');
            if (!email) {
                msg.className = 'alert alert-danger';
                msg.textContent = 'Please enter your email.';
                msg.classList.remove('d-none');
                return;
            }

            msg.className = 'alert alert-info';
            msg.textContent = 'Sending reset link...';
            msg.classList.remove('d-none');

            try {
                await firebase.auth().sendPasswordResetEmail(email);
                msg.className = 'alert alert-success';
                msg.textContent = '✅ Reset link sent! Check your email inbox.';
            } catch (e) {
                msg.className = 'alert alert-danger';
                msg.textContent = '❌ Failed: ' + (e && e.message ? e.message : 'Unknown error');
            }
        }

        // Professional Error Dialog
        function showErrorDialog(title, message, type) {
            // Remove existing overlay if any
            const existing = document.querySelector('.error-toast-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.className = 'error-toast-overlay';
            
            const iconClass = type === 'warning' ? 'warning' : 'danger';
            const icon = type === 'warning' ? '⚠️' : '❌';
            
            overlay.innerHTML = `
                <div class="error-toast-dialog">
                    <div class="error-icon ${iconClass}">${icon}</div>
                    <h4>${title}</h4>
                    <p>${message}</p>
                    <button class="btn-dismiss">Got it</button>
                </div>
            `;
            
            document.body.appendChild(overlay);
            
            overlay.querySelector('.btn-dismiss').addEventListener('click', () => {
                overlay.style.animation = 'fadeIn 0.2s ease reverse';
                setTimeout(() => overlay.remove(), 200);
            });
            
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.style.animation = 'fadeIn 0.2s ease reverse';
                    setTimeout(() => overlay.remove(), 200);
                }
            });
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loadingDiv = document.getElementById('login-loading');
            const submitBtn = document.getElementById('login-submit-btn');
            const form = this;
            
            // Hide form, show loading
            form.querySelector('.input-group, .btn-link, .btn-primary').style.display = 'none';
            loadingDiv.classList.remove('d-none');
            submitBtn.disabled = true;
            
            try {
                const result = await auth.login(email, password);
                
                if (result.success) {
                    // Show success animation
                    loadingDiv.innerHTML = `
                        <div class="success-check">✅</div>
                        <p style="color:#16a34a;">Login successful! Redirecting...</p>
                    `;
                    
                    setTimeout(() => {
                        window.location.href = result.role === 'admin' ? 'admin.html' : 
                                             result.role === 'seller' ? 'seller.html' : 
                                             result.role === 'delivery' ? 'delivery.html' : 'index.html';
                    }, 1200);
                } else {
                    // Show professional error dialog
                    loadingDiv.classList.add('d-none');
                    form.querySelector('.input-group, .btn-link, .btn-primary').style.display = '';
                    submitBtn.disabled = false;
                    
                    let title = 'Login Failed';
                    let message = result.error;
                    let type = 'error';
                    
                    if (result.error.includes('password') || result.error.includes('Incorrect')) {
                        title = 'Wrong Password';
                        message = 'The password you entered is incorrect. Please try again or click "Forgot Password" to reset it.';
                    } else if (result.error.includes('No account')) {
                        title = 'Account Not Found';
                        message = 'No account exists with this email address. Please check your email or create a new account.';
                    } else if (result.error.includes('Too many')) {
                        title = 'Too Many Attempts';
                        message = 'You have made too many login attempts. Please wait a few minutes before trying again.';
                        type = 'warning';
                    } else if (result.error.includes('Invalid email')) {
                        title = 'Invalid Email';
                        message = 'Please enter a valid email address (e.g., name@example.com).';
                    }
                    
                    showErrorDialog(title, message, type);
                }
            } catch (err) {
                loadingDiv.classList.add('d-none');
                form.querySelector('.input-group, .btn-link, .btn-primary').style.display = '';
                submitBtn.disabled = false;
                showErrorDialog('Error', 'An unexpected error occurred. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
