<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery History - Ibad Foodz</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: var(--bg-gradient);">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-motorcycle"></i> Ibad Foodz</a>
      <div class="ms-auto d-flex gap-2">
        <a href="delivery.html" class="btn btn-outline-light btn-sm">
          <i class="fas fa-arrow-left me-1"></i>Back
        </a>
      </div>
    </div>
  </nav>

    <div class="container" style="padding-top: 90px; padding-bottom: 50px;">
      <h3 class="fw-bold mb-4"><i class="fas fa-history me-2" style="color:var(--primary);"></i>Delivery History</h3>
      
      <!-- Stats Row -->
      <div class="row mb-4">
        <div class="col-md-4 col-6 mb-2">
          <div class="card p-3 text-center shadow-sm border-0">
            <h6 class="text-muted">✅ Total Delivered</h6>
            <h3 class="fw-bold text-success mb-0" id="hist-delivered">0</h3>
          </div>
        </div>
        <div class="col-md-4 col-6 mb-2">
          <div class="card p-3 text-center shadow-sm border-0">
            <h6 class="text-muted">💰 Total Earned</h6>
            <h3 class="fw-bold text-warning mb-0" id="hist-earned">₹0</h3>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Order ID</th>
                  <th>Restaurant</th>
                  <th>Customer</th>
                  <th>Delivered At</th>
                  <th class="text-end pe-4">Earnings</th>
                </tr>
              </thead>
              <tbody id="history-table-body">
                <tr><td colspan="5" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="border-radius:20px;overflow:hidden;">
          <div class="modal-header border-0" style="background:linear-gradient(135deg,#fff0eb,#ffe4d6);">
            <h5 class="modal-title fw-bold" style="color:#ff6b35;"><i class="fas fa-receipt me-2"></i>Order Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4" id="order-detail-body">
            <div class="text-center py-4 text-muted">Loading...</div>
          </div>
        </div>
      </div>
    </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tbody = document.getElementById('history-table-body');
      try {
        const state = await auth.init();
        if (!state.user || state.role !== 'delivery') {
          window.location.href = 'login.html';
          return;
        }
        await loadHistory(state.user.uid);
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center py-4">${e.message}</td></tr>`;
      }
    });

    function showOrderDetail(order) {
      if (!order) return;
      const body = document.getElementById('order-detail-body');
      
      const orderId = order.id || order.orderId || '';
      const items = order.items || [];
      const itemTotal = Number(order.totalAmount || 0);
      const deliveryFee = Number(order.deliveryFee || 0);
      const additionalCharges = Number(order.additionalCharges || order.extraCharges || order.taxes || 0);
      const couponDiscount = Number(order.couponDiscount || 0);
      const walletDiscount = Number(order.walletDiscount || 0);
      const finalAmount = Number(order.finalAmount ?? Math.max(0, itemTotal + deliveryFee + additionalCharges - couponDiscount - walletDiscount));
      const earnings = Number(order.earnings || 0);
      const deliveredAt = order.deliveredAt ? new Date(order.deliveredAt).toLocaleString() : 'N/A';
      
      const itemsHtml = items.length > 0 ? items.map(item => `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;">
          <div><span style="font-weight:600;">${item.name || 'Item'}</span><span style="color:#888;margin-left:8px;">x${item.qty || 1}</span></div>
          <div style="font-weight:600;">₹${Number(item.price || 0).toFixed(2)}</div>
        </div>
      `).join('') : '<div style="color:#888;text-align:center;padding:8px;">No items data</div>';

      body.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
          <div>
            <div style="font-size:0.8rem;color:#888;">Order ID</div>
            <div style="font-size:1.3rem;font-weight:800;">#${orderId.slice(-6).toUpperCase()}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.8rem;color:#888;">Delivered</div>
            <div style="font-size:0.85rem;font-weight:600;">${deliveredAt}</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
          <div style="background:#f8f9fa;border-radius:12px;padding:14px;">
            <div style="font-size:0.75rem;color:#888;margin-bottom:4px;">👤 Customer</div>
            <div style="font-weight:700;">${order.customerName || 'N/A'}</div>
            ${order.customerPhone ? `<div style="font-size:0.8rem;color:#555;margin-top:4px;">📞 ${order.customerPhone}</div>` : ''}
            ${order.customerEmail ? `<div style="font-size:0.8rem;color:#555;">✉️ ${order.customerEmail}</div>` : ''}
          </div>
          <div style="background:#f8f9fa;border-radius:12px;padding:14px;">
            <div style="font-size:0.75rem;color:#888;margin-bottom:4px;">📍 Delivery Address</div>
            <div style="font-weight:700;">${order.deliveryAddress || 'N/A'}</div>
            ${order.city ? `<div style="font-size:0.8rem;color:#555;margin-top:2px;">${order.city}${order.pincode ? ' - '+order.pincode : ''}</div>` : ''}
          </div>
        </div>

        <div style="background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-size:0.75rem;color:#888;margin-bottom:6px;">🏪 Restaurant</div>
          <div style="font-weight:700;">${order.restaurantName || 'N/A'}</div>
          ${order.deliveryPartnerName ? `<div style="font-size:0.8rem;color:#555;margin-top:4px;">🛵 Delivered by: ${order.deliveryPartnerName}</div>` : ''}
        </div>

        <div style="background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-size:0.75rem;color:#888;margin-bottom:6px;">📋 Items</div>
          ${itemsHtml}
        </div>

        <div style="background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-size:0.75rem;color:#888;margin-bottom:6px;">💰 Payment Breakdown</div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;">
            <span style="color:#555;">Subtotal</span><span>₹${itemTotal.toFixed(2)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;">
            <span style="color:#555;">Delivery Fee</span><span>₹${deliveryFee.toFixed(2)}</span>
          </div>
          ${additionalCharges > 0 ? `<div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:#555;">Additional Charges</span><span>₹${additionalCharges.toFixed(2)}</span></div>` : ''}
          ${couponDiscount > 0 ? `<div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:#555;">Coupon Discount</span><span style="color:#16a34a;">-₹${couponDiscount.toFixed(2)}</span></div>` : ''}
          ${walletDiscount > 0 ? `<div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:#555;">Wallet Discount</span><span style="color:#16a34a;">-₹${walletDiscount.toFixed(2)}</span></div>` : ''}
          <div style="display:flex;justify-content:space-between;padding:6px 0;margin-top:4px;border-top:2px dashed #ddd;font-weight:800;font-size:1.05rem;">
            <span>Total Amount</span>
            <span style="color:#16a34a;">₹${finalAmount.toFixed(2)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;color:#16a34a;font-weight:700;">
            <span>🛵 Your Earnings</span>
            <span>+₹${earnings.toFixed(2)}</span>
          </div>
        </div>

        <div style="text-align:center;margin-top:8px;">
          <button class="btn btn-primary" data-bs-dismiss="modal" style="border-radius:12px;padding:10px 32px;font-weight:700;">
            <i class="fas fa-check me-1"></i> Close
          </button>
        </div>
      `;
      
      new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
    }

    async function loadHistory(uid) {
      const tbody = document.getElementById('history-table-body');
      try {
        const [historySnap, ordersSnap] = await Promise.all([
          db.ref('deliveryHistory').once('value'),
          db.ref('orders').once('value')
        ]);
        tbody.innerHTML = '';
        
        const historyMap = {};
        if (historySnap.exists()) {
          historySnap.forEach(child => {
            const h = child.val();
            if (h.deliveryPartnerId === uid && h.orderId) {
              const amount = Number(h.amount) || 0;
              const existing = historyMap[h.orderId];
              if (!existing || Number(h.deliveredAt || 0) > Number(existing.deliveredAt || 0)) {
                historyMap[h.orderId] = { ...h, historyId: child.key, amount };
              }
            }
          });
        }
        
        const orders = [];
        let deliveredCount = 0;
        let totalEarned = 0;

        if (ordersSnap.exists()) {
          ordersSnap.forEach(child => {
            const o = child.val();
            if (o.deliveryPartnerId === uid && o.status === 'Delivered') {
              const history = historyMap[o.id] || {};
              const earnings = Number(history.amount) || Math.max(25, (o.totalAmount || 0) * 0.05);
              orders.push({
                id: child.key,
                ...o,
                deliveredAt: history.deliveredAt || o.deliveredAt || o.timestamp,
                earnings
              });
              deliveredCount++;
              totalEarned += earnings;
            }
          });
        }

        Object.keys(historyMap).forEach(orderId => {
          const history = historyMap[orderId];
          if (!orders.some(o => o.id === orderId)) {
            orders.push({
              id: orderId,
              orderId,
              restaurantName: 'N/A',
              customerName: 'N/A',
              deliveredAt: history.deliveredAt,
              earnings: history.amount
            });
            deliveredCount++;
            totalEarned += history.amount;
          }
        });

        document.getElementById('hist-delivered').textContent = deliveredCount;
        document.getElementById('hist-earned').textContent = '₹' + totalEarned.toFixed(2);

        orders.sort((a, b) => Number(b.deliveredAt || 0) - Number(a.deliveredAt || 0));

        if (orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted"><i class="fas fa-box-open fa-2x mb-2"></i><br>No completed deliveries yet.</td></tr>';
          return;
        }

        for (const o of orders) {
          const date = o.deliveredAt ? new Date(o.deliveredAt).toLocaleString() : 'N/A';
          const earnings = Number(o.earnings || 0).toFixed(2);
          
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.addEventListener('click', () => showOrderDetail(o));
          tr.innerHTML = `
            <td class="ps-4"><strong>#${o.id.slice(-6)}</strong></td>
            <td>${o.restaurantName || 'N/A'}</td>
            <td>${o.customerName || 'N/A'}</td>
            <td><small class="text-muted">${date}</small></td>
            <td class="text-end pe-4 text-success fw-bold">+₹${earnings}</td>
          `;
          tbody.appendChild(tr);
        }
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center py-4">${e.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
