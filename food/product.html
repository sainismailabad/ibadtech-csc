<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Ibad Foodie | Food Delivery</title>
    <meta name="description" content="View product details, images, description and price. Order from top restaurants on Ibad Foodie.">
    <meta property="og:title" content="Product - Ibad Foodie">
    <meta property="og:type" content="product">
    <meta property="og:url" content="https://ibadecomerce.firebaseapp.com/product.html">
    <link rel="canonical" href="https://ibadecomerce.firebaseapp.com/product.html">
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-main-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .product-main-image:hover { transform: scale(1.02); }
        .product-thumb {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
        }
        .product-thumb:hover, .product-thumb.active { border-color: var(--primary); }
        .product-info { padding: 20px; }
        .product-info h1 { font-weight: 800; font-size: 2rem; }
        .product-price { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        .description-box { background: white; border-radius: 12px; padding: 24px; }
        .shop-badge { background: #f3f4f6; padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; }
        .share-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .share-buttons .btn { flex: 1; min-width: 100px; }
        @media (max-width: 768px) {
            .product-main-image { height: 300px; }
            .product-info h1 { font-size: 1.5rem; }
            .product-price { font-size: 1.8rem; }
        }
        .image-gallery-modal img { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-utensils"></i> Ibad Foodie</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="restaurant.html"><i class="fas fa-store me-1"></i>Restaurants</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart me-1"></i>Cart</a></li>
                    <li class="nav-item" id="nav-orders"><a class="nav-link" href="customer-orders.html">My Orders</a></li>
                    <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item" id="nav-register"><a class="nav-link" href="register-customer.html">Register</a></li>
                    <li class="nav-item" id="nav-profile"><a class="nav-link" href="profile.html"><i class="fas fa-user me-1"></i>Profile</a></li>
                    <li class="nav-item" id="nav-delivery-profile"><a class="nav-link" href="delivery-profile.html"><i class="fas fa-motorcycle me-1"></i>Delivery Profile</a></li>
                    <li class="nav-item" id="nav-logout"><a class="nav-link" href="#" onclick="auth.logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 100px; padding-bottom: 40px;">
        <div id="loading-section" class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2">Loading product details...</p>
        </div>
        <div id="product-section" style="display: none;">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active" id="breadcrumb-product">Product</li>
                </ol>
            </nav>
            <div class="row">
                <div class="col-lg-7 mb-4">
                    <div id="image-carousel" class="mb-3">
                        <img id="main-image" class="product-main-image mb-3" src="" alt="Product Image" onclick="openImageGallery()">
                        <div class="row" id="thumbnails"></div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="product-info">
                        <h1 id="product-name"></h1>
                        <p class="text-muted mb-2" id="product-shop"></p>
                        <p class="product-price mb-3" id="product-price"></p>
                        <p class="mb-3"><span class="badge bg-success fs-6" id="product-stock">In Stock</span> <span class="badge bg-info text-dark fs-6" id="product-category"></span> <span class="badge bg-danger fs-6" id="product-restaurant-status" style="display:none;">Offline</span></p>
                        <p class="text-muted mb-2" id="product-meta"></p>
                        <p class="text-muted mb-4" id="product-description"></p>
                        <p class="text-muted mb-4" id="product-ingredients"></p>
                        
                        <div class="d-grid gap-2 mb-4">
                            <button class="btn btn-primary btn-lg" id="buy-now-btn" onclick="handleBuyNow()">
                                <i class="fas fa-shopping-cart me-2"></i>Buy Now
                            </button>
                        </div>

                        <div class="share-buttons mb-4">
                            <button class="btn btn-outline-primary" onclick="shareProduct('whatsapp')"><i class="fab fa-whatsapp me-1"></i>WhatsApp</button>
                            <button class="btn btn-outline-info" onclick="shareProduct('facebook')"><i class="fab fa-facebook me-1"></i>Facebook</button>
                            <button class="btn btn-outline-secondary" onclick="shareProduct('copy')"><i class="fas fa-link me-1"></i>Copy Link</button>
                        </div>

                        <div class="shop-badge">
                            <i class="fas fa-store fa-2x text-primary"></i>
                            <div>
                                <strong id="shop-name-badge"></strong><br>
                                <small class="text-muted">Verified Restaurant</small>
                            </div>
                            <a id="visit-shop-link" href="#" class="btn btn-sm btn-outline-primary ms-auto">Visit Restaurant</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Gallery Modal -->
    <div class="modal fade" id="imageGalleryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Product Images</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><div id="gallery-images"></div></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        let currentProduct = null;
        let currentProductId = null;
        let currentImages = [];

        function getProductId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadProduct() {
            const productId = getProductId();
            if (!productId) {
                document.getElementById('loading-section').innerHTML = '<div class="alert alert-danger">No product ID specified</div>';
                return;
            }

            await auth.init();
            updateNav();

            try {
                const snap = await db.ref('products/' + productId).once('value');
                if (!snap.exists()) {
                    document.getElementById('loading-section').innerHTML = '<div class="alert alert-warning">Product not found</div>';
                    return;
                }

                currentProduct = snap.val();
                currentProductId = productId;
                currentImages = currentProduct.images || [currentProduct.image || 'https://via.placeholder.com/600x400'];

                document.getElementById('loading-section').style.display = 'none';
                document.getElementById('product-section').style.display = 'block';

                // Update SEO meta
                document.title = currentProduct.name + ' - Ibad Foodie';
                document.querySelector('meta[name="description"]').content = currentProduct.description || 'View product details on Ibad Foodie';
                document.querySelector('meta[property="og:title"]').content = currentProduct.name + ' - Ibad Foodie';
                
                // Breadcrumb
                document.getElementById('breadcrumb-product').textContent = currentProduct.name;

                // Main content
                document.getElementById('product-name').textContent = currentProduct.name;
                document.getElementById('product-price').textContent = '₹' + Number(currentProduct.price || 0).toFixed(2);
                document.getElementById('product-shop').innerHTML = '<i class="fas fa-store me-1"></i> Sold by: <strong>' + (currentProduct.shopName || 'Unknown Shop') + '</strong>';
                const restaurantStatus = document.getElementById('product-restaurant-status');
                if (currentProduct.sellerId) {
                    const restSnap = await db.ref('restaurants/' + currentProduct.sellerId).once('value');
                    const restaurant = restSnap.val() || {};
                    if (restaurant.isOnline === false) {
                        restaurantStatus.style.display = '';
                        document.getElementById('buy-now-btn').disabled = true;
                        document.getElementById('buy-now-btn').innerHTML = '<i class="fas fa-ban me-2"></i>Restaurant Offline';
                    }
                }
                document.getElementById('product-description').textContent = currentProduct.description || 'No description available';
                document.getElementById('product-ingredients').innerHTML = currentProduct.ingredients ? '<i class="fas fa-seedling me-1"></i><strong>What\'s inside:</strong> ' + currentProduct.ingredients : '';
                const buyNowBtn = document.getElementById('buy-now-btn');
                if (!buyNowBtn.disabled) buyNowBtn.disabled = currentProduct.stock <= 0;

                // Shop badge
                document.getElementById('shop-name-badge').textContent = currentProduct.shopName || 'Unknown Shop';
                document.getElementById('visit-shop-link').href = 'restaurant-detail.html?id=' + encodeURIComponent(currentProduct.sellerId || '');

                // Images
                loadImages(currentImages);

            } catch (e) {
                document.getElementById('loading-section').innerHTML = '<div class="alert alert-danger">Error: ' + e.message + '</div>';
            }
        }

        function loadImages(images) {
            if (images.length === 0) images = ['https://via.placeholder.com/600x400'];
            
            // Set main image
            const mainImg = document.getElementById('main-image');
            mainImg.src = images[0];
            mainImg.onerror = function() { this.src = 'https://via.placeholder.com/600x400'; };

            // Set thumbnails
            const thumbs = document.getElementById('thumbnails');
            thumbs.innerHTML = '';
            images.forEach((url, i) => {
                const col = document.createElement('div');
                col.className = 'col-3';
                const img = document.createElement('img');
                img.className = 'product-thumb ' + (i === 0 ? 'active' : '');
                img.src = url;
                img.alt = 'Product Image ' + (i + 1);
                img.onerror = function() { this.src = 'https://via.placeholder.com/100x100'; };
                img.onclick = function() {
                    document.querySelectorAll('.product-thumb').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('main-image').src = this.src;
                };
                col.appendChild(img);
                thumbs.appendChild(col);
            });
        }

        function openImageGallery() {
            const gallery = document.getElementById('gallery-images');
            gallery.innerHTML = '';
            currentImages.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'mb-3';
                img.onerror = function() { this.src = 'https://via.placeholder.com/600x400'; };
                gallery.appendChild(img);
            });
            new bootstrap.Modal(document.getElementById('imageGalleryModal')).show();
        }

        async function handleBuyNow() {
            if (!auth.currentUser) {
                window.location.href = 'login.html';
                return;
            }
            if (!currentProduct) return;
            if (currentProduct?.sellerId) {
                const restSnap = await db.ref('restaurants/' + currentProduct.sellerId).once('value');
                const restaurant = restSnap.val() || {};
                if (restaurant.isOnline === false) {
                    alert('Sorry! ' + (restaurant.name || 'This restaurant') + ' is currently Offline. Please order from an online restaurant.');
                    return;
                }
            }
            window.location.href = 'index.html?seller=' + encodeURIComponent(currentProduct.sellerId || '') + '&buy=' + currentProductId;
        }

        function shareProduct(platform) {
            const url = window.location.href;
            const text = 'Check out ' + currentProduct.name + ' at Ibad Foodie!';
            switch(platform) {
                case 'whatsapp':
                    window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');
                    break;
                case 'facebook':
                    window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank');
                    break;
                case 'copy':
                    navigator.clipboard.writeText(url).then(() => alert('Product link copied!'));
                    break;
            }
        }

        function updateNav() {
            const hide = (id) => { const el = document.getElementById(id); if (el) el.style.display = 'none'; };
            const show = (id) => { const el = document.getElementById(id); if (el) el.style.display = 'block'; };
            if (auth.currentUser) {
                show('nav-logout');
                hide('nav-login');
                hide('nav-register');
                show('nav-orders');
                show('nav-profile');
                show('nav-delivery-profile');
            } else {
                hide('nav-logout');
                show('nav-login');
                show('nav-register');
                hide('nav-orders');
                hide('nav-profile');
                hide('nav-delivery-profile');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProduct);
    </script>
</body>
</html>
