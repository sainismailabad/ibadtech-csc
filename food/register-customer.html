<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Register - Ibad Foodie</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-md-6">
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand"><i class="fas fa-utensils"></i> Ibad Foodie</a>
        </div>

        <div class="card">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              <div style="font-size: 2.5rem;">🍕</div>
              <h3 class="card-title fw-bold mt-2">Create Customer Account</h3>
              <p class="text-muted">Register to start ordering</p>
            </div>

            <form id="register-form">
              <div class="mb-3">
                <label for="email" class="form-label">Email Address *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required minlength="6" />
                </div>
              </div>

              <div class="mb-3">
                <div class="alert alert-info mb-0">
                  On creating account, we will send a verification email to your inbox.
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">Create Customer Account</button>
            </form>

            <div class="text-center mt-4">
              <p class="mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold">Sign In</a></p>
            </div>

            <div id="register-error" class="alert alert-danger mt-3 d-none"></div>
            <div id="register-loading" class="text-center mt-3 d-none">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2">Creating your Ibad Foodie account...</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>

  <script>
    document.getElementById('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const errorDiv = document.getElementById('register-error');
      const loadingDiv = document.getElementById('register-loading');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      errorDiv.classList.add('d-none');
      errorDiv.classList.remove('alert-success');
      errorDiv.classList.add('alert-danger');

      loadingDiv.classList.remove('d-none');
      submitBtn.disabled = true;

      try {
        const result = await auth.register(email, password, 'customer', null);

        if (result.success) {
          errorDiv.classList.remove('alert-danger');
          errorDiv.classList.add('alert-success');
          errorDiv.innerHTML = '<i class="fas fa-check-circle"></i> Account created! You can now login.';
          errorDiv.classList.remove('d-none');
          loadingDiv.classList.add('d-none');

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          errorDiv.textContent = result.error;
          errorDiv.classList.remove('d-none');
          loadingDiv.classList.add('d-none');
          submitBtn.disabled = false;
        }
      } catch (err) {
        errorDiv.textContent = 'Registration failed: ' + err.message;
        errorDiv.classList.remove('d-none');
        loadingDiv.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
